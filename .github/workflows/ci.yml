name: Repository CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Run the complete two-engine site design acceptance
        type: boolean
        default: false
      expected_sha:
        description: Full reviewed commit SHA (required for browser acceptance)
        type: string
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: apple-compare-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Price and route validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Bind a manually requested candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
          RUN_BROWSER: ${{ inputs.browser }}
        run: |
          set -euo pipefail
          if [[ "$RUN_BROWSER" == "true" || -n "$EXPECTED_SHA" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$EXPECTED_SHA" = "$EVENT_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          fi
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Run dependency-free site validator
        run: python3 scripts/validate_site.py
      - name: Run branch outcome and script tests
        run: |
          node --check iphone/trade-in-guide/model.js
          node --check iphone/trade-in-guide/ui.js
          node --check iphone/trade-in-guide/app.js
          node --check osprey/series/app.js
          node --check scripts/site-standards-browser.mjs
          node scripts/test_iphone_tradein.js
          node scripts/test_calendar_date.cjs
          python3 scripts/test_design_contract.py
      - name: Validate pinned Astro build and route parity
        run: |
          npm ci
          npm run check

  browser:
    name: Site design browser acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Verify candidate and install only the browser driver
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm install --prefix "$RUNNER_TEMP/product-browser" --no-save --package-lock=false playwright@1.64.1
      - name: Check every route, state, viewport and design consumer
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/product-browser/node_modules/playwright/index.mjs" node scripts/site-standards-browser.mjs
      - name: Upload candidate-bound measurements and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-design-${{ inputs.expected_sha }}-${{ github.run_id }}
          path: reports/site-standards/
          if-no-files-found: error
          retention-days: 3
